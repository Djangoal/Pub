name: Build avec recherche et vérification 3

on:
  workflow_dispatch:  # 🔥 Pas de déclenchement automatique

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y python3 python3-pip python3-setuptools python3-wheel zip unzip openjdk-17-jdk
          pip install buildozer cython

      - name: Install Android SDK/NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-31" "build-tools;31.0.0"

      - name: Build APK
        run: |
          buildozer android release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: |
            .buildozer/android/platform/build-armeabi-v7a/dists/*/bin/*.apk

      # 🔍 Recherche et ouverture du fichier APK APRÈS l’upload
      - name: Find and unzip APK
        run: |
          APK_PATH=$(find .buildozer/android/platform/build-armeabi-v7a/dists -name "*.apk" | head -n 1)
          echo "APK found at: $APK_PATH"
          mkdir extracted_apk
          unzip -o "$APK_PATH" -d extracted_apk

      # 🔎 Vérification présence de "AdView" dans le code smali
      - name: Check for AdView
        run: |
          echo "Searching for AdView..."
          if grep -R "AdView" -n extracted_apk/ ; then
            echo "❌ AdView FOUND inside the APK!"
            exit 1
          else
            echo "✅ No AdView found in APK."
          fi
