name: Build Apk release et debug 5

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: "Choose build type"
        required: false
        default: "debug"
        type: choice
        options:
          - debug
          - release

jobs:
  build_android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set build type
      run: |
        if [ -z "${{ github.event.inputs.build_type }}" ]; then
          echo "BUILD_TYPE=debug" >> $GITHUB_ENV
        else
          echo "BUILD_TYPE=${{ github.event.inputs.build_type }}" >> $GITHUB_ENV
        fi
    - name: Display build type
      run: |
       echo "Building: $BUILD_TYPE"
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libltdl-dev zip unzip openjdk-17-jdk python3-pip libncurses-dev libtool libtool-bin automake autoconf pkg-config m4
    - name: Install Buildozer
      run: |
        python -m pip install --upgrade pip setuptools cython==0.29.33
        pip install buildozer
    - name: Install Android SDK Command Line Tools + Build Tools
      run: |
        mkdir -p $HOME/Android/cmdline-tools
        wget https://dl.google.com/android/repository/commandlinetools-linux-9123335_latest.zip -O cmdline-tools.zip
        unzip cmdline-tools.zip -d $HOME/Android/cmdline-tools
        yes | $HOME/Android/cmdline-tools/cmdline-tools/bin/sdkmanager --sdk_root=$HOME/Android --licenses
        $HOME/Android/cmdline-tools/cmdline-tools/bin/sdkmanager \
          "platform-tools" \
          "platforms;android-33" \
          "build-tools;33.0.2"
    - name: Configure Android env
      run: |
        echo "ANDROID_SDK_ROOT=$HOME/Android" >> $GITHUB_ENV
        echo "PATH=$HOME/Android/cmdline-tools/cmdline-tools/bin:$HOME/Android/platform-tools:$PATH" >> $GITHUB_ENV
    - name: Build APK with Buildozer
      run: |
        if [ "$BUILD_TYPE" = "release" ]; then
            buildozer --verbose android release
        else
            buildozer --verbose android debug
        fi
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
       name: android-apk
       path: |
          bin/*debug*.apk
          bin/*release*.apk

    - name: Verify AdView presence inside APK
      run: |
        APK_FILE=$(ls bin/*.apk | head -n 1)
        echo "Checking AdView inside $APK_FILE..."
        unzip -p "$APK_FILE" classes.dex | strings | grep -q "AdView" && echo "AdView FOUND!" || (echo "ERROR: AdView not found!" && exit 1)
